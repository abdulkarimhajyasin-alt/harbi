{% extends "base.html" %}
{% block title %}إعدادات الحساب{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <h1>إعدادات الحساب</h1>
  </div>
</header>

<section class="panel account-panel">
  {% if success %}<p class="success">تم حفظ التغييرات بنجاح</p>{% endif %}
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/account" class="form" novalidate>
    <label for="username">اسم المستخدم</label>
    <input id="username" name="username" type="text" value="{{ username }}" autocomplete="username">

    <label for="password">كلمة المرور الجديدة</label>
    <input id="password" name="password" type="password" autocomplete="new-password">

    <label for="confirm_password">تأكيد كلمة المرور</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password">

    <div class="actions">
      <button type="submit">حفظ التغييرات</button>
      <a class="small-button secondary" href="/dashboard">إلغاء</a>
    </div>
  </form>
</section>
{% endblock %}
