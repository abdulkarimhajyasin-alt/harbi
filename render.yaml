services:
  - type: web
    name: jard-hisabati
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jard-hisabati-db
          property: connectionString
      - key: SESSION_SECRET_KEY
        sync: false
      - key: APP_NAME
        value: جرد حساباتي
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: jard-hisabati-db
